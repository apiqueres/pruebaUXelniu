<div class="ruido"></div>

@if (!esAdmin()) {
  <header class="cabecera">
    <a routerLink="/" class="marca" aria-label="Inicio · Restaurant el Niu">&#8212;EL NIU</a>

    <div class="cabecera__acciones">
      <a class="boton boton--claro" [href]="'tel:+34' + restaurante().telefono">Llamar</a>
      <a class="boton" routerLink="/reservar">Reservar</a>
    </div>
  </header>
}

<main [class.main--admin]="esAdmin()">
  <router-outlet />
</main>

@if (!esAdmin()) {
  <nav class="barra" aria-label="Secciones">
    <a
      routerLink="/"
      routerLinkActive="barra__enlace--activo"
      [routerLinkActiveOptions]="{ exact: true }"
      class="barra__enlace etiqueta"
      >Inicio</a
    >
    @for (s of secciones; track s.ruta) {
      <a
        [routerLink]="s.ruta"
        routerLinkActive="barra__enlace--activo"
        class="barra__enlace etiqueta"
        >{{ s.etiqueta }}</a
      >
    }
  </nav>
}
