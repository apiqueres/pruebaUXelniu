# Publica solo la parte web en GitHub Pages.
#
# Ojo: desde que la aplicacion lee la carta de la API, lo que se publica aqui
# NO funciona por si solo. Sin un backend accesible ensena la pantalla de «no
# se puede cargar la carta». Sirve para ver el diseno; el sitio de verdad es el
# VPS, con las dos mitades detras del mismo nginx.
name: Publicar la web en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      # Un cambio que solo toque el backend no tiene por que republicar la web.
      - 'elniu-app/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si se empujan dos commits seguidos, que el segundo espere al primero en vez
# de cancelarlo: asi la web publicada nunca se queda a medias.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    defaults:
      run:
        # El frontend ya no esta en la raiz del repositorio.
        working-directory: elniu-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: elniu-app/package-lock.json

      - run: npm ci

      # La web no cuelga de la raiz del dominio sino de /pruebaUXelniu/, y sin
      # este base-href el index pediria los scripts y las fotos a la raiz.
      - run: npm run build -- --base-href "/${{ github.event.repository.name }}/"

      # Pages sirve ficheros estaticos y no sabe de rutas de Angular: al abrir
      # /carta directamente o al recargar buscaria un carta.html que no existe.
      # Con el index duplicado como 404.html, esas peticiones caen igualmente
      # en la aplicacion y el router se encarga.
      - run: cp dist/elniu-app/browser/index.html dist/elniu-app/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: elniu-app/dist/elniu-app/browser

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
